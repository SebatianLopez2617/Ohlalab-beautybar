<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Cita | Ohlalab BeautyBar</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="agenda2.css">
</head>
<body>

    <header id="main-header">
        <nav class="navbar">
            <div class="header-logo">
                <a href="../index.html">
                    <img src="../Fotos/logo2.png" alt="Ohlalab BeautyBar Logo" class="brand-logo">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="../servicioscarp/servicios.html">Servicios</a></li>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../usuario/inicio_de_secion.html" class="nav-login-btn">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-strip">
        <h1>Ohlalab BeautyBar</h1>
        <p>Reserva tu momento de belleza</p>
    </div>

    <div class="main-wrap">
        <div class="card">
            <h2 class="card-title">Agenda tu cita</h2>
            <p class="card-subtitle">Completa los campos para continuar</p>

            <form id="form-reserva" class="form-grid">
                
                <div class="form-group full">
                    <label for="nombre">Nombre Completo <span class="req">*</span></label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Nombre completo">
                </div>

                <div class="form-group full">
                    <label for="correo">Correo Electrónico (Requiere de una cuenta creada) <span class="req">*</span></label>
                    <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
                </div>

                <div class="form-group full">
                    <label>Servicios Disponibles <span class="req">*</span></label>
                    <div class="servicios-grid">
                        <label class="chip-label"><input type="radio" name="servicio" value="alaciado" required><span>Alaciado</span></label>
                        <label class="chip-label"><input type="radio" name="servicio" value="cejas"><span>Cejas</span></label>
                        <label class="chip-label"><input type="radio" name="servicio" value="labios"><span>Labios</span></label>
                        <label class="chip-label"><input type="radio" name="servicio" value="pestanas"><span>Pestañas</span></label>
                        <label class="chip-label"><input type="radio" name="servicio" value="lipo"><span>Lipo</span></label>
                        <label class="chip-label"><input type="radio" name="servicio" value="maquillaje"><span>Maquillaje</span></label>
                        <label class="chip-label"><input type="radio" name="servicio" value="uñas_pie"><span>Uñas Pie</span></label>
                        <label class="chip-label"><input type="radio" name="servicio" value="uñas_mano"><span>Uñas Mano</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha (2026) <span class="req">*</span></label>
                    <input type="date" id="fecha" name="fecha" min="2026-01-01" max="2026-12-31" required>
                </div>

                <div class="form-group">
                    <label for="hora">Hora (10:00 - 20:00) <span class="req">*</span></label>
                    <input type="time" id="hora" name="hora" min="10:00" max="20:00" required>
                </div>

                <div class="form-group full">
                    <label for="notas">Notas requeridas <span class="req">*</span></label>
                    <textarea id="notas" name="notas" required placeholder="Escribe aquí tus notas..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Confirmar Cita</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-container">
            <div class="footer-info">
                <h3>Ohlalab BeautyBar</h3>
                <p>Tizayuca, Hidalgo.</p>
            </div>
            <div class="social-icons">
                <a href="https://www.facebook.com/share/18fzqoqS6F/"><img src="../iconos/iconFC.PNG" alt="FB"></a>
                <a href="https://www.instagram.com/ohlalabsalon?igsh=MWxhczE5dmtveTdiZA=="><img src="../iconos/IGN.png" alt="IG"></a>
                <a href="https://api.whatsapp.com/send?phone=5215526960091"><img src="../iconos/WP.png" alt="WA"></a>
            </div>
            <p class="copyright">© 2026 Todos los derechos reservados</p>
        </div>
    </footer>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const usuario = JSON.parse(localStorage.getItem('usuarioLogueado'));
        const btnLogin = document.querySelector('.nav-login-btn');

        if (usuario && btnLogin) {
            btnLogin.innerHTML = `Hola, ${usuario.nombre.split(' ')[0]} ✨`;
            btnLogin.href = "../usuario/perfil.html";
        }
    });
</script>
<script src="agenda.js"></script>
</body>
</html>
